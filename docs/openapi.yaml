openapi: 3.0.3
info:
  title: хелпи API
  version: 2026.09.30
  description: API мини-приложения MAX. Production-личные методы требуют подпись MAX. Изолированное HTTPS-демо /api-test использует отдельную БД и HttpOnly cookie-сессию без токенов.
servers:
  - url: /
  - url: /api-test
security:
  - maxInitData: []
paths:
  /api:
    get:
      security: []
      description: Public Swagger UI. Personal endpoints still require MAX authentication.
      responses:
        '200':
          description: Interactive API documentation
          content:
            text/html:
              schema: {type: string}
  /api/index.json:
    get:
      security: []
      description: Machine-readable public API entry point
      responses:
        '200':
          description: API version, documentation and health links
          content:
            application/json:
              schema:
                type: object
                required: [name, version, openapi, health, authentication]
                properties:
                  name: {type: string}
                  version: {type: string}
                  openapi: {type: string}
                  health: {type: string}
                  authentication: {type: string}
  /api/openapi.yaml:
    get:
      security: []
      description: Public OpenAPI 3.0 specification
      responses:
        '200':
          description: OpenAPI YAML document
          content:
            application/yaml:
              schema: {type: string}
  /api/health:
    get:
      security: []
      responses:
        '200': {description: Service health}
  /api/max/webhook:
    post:
      security: []
      description: MAX Webhook endpoint; authenticated with X-Max-Bot-Api-Secret.
      responses:
        '200': {description: Update accepted}
        '403': {description: Invalid webhook secret}
  /api/bootstrap:
    get:
      responses:
        '200':
          description: Current user, plans, location and curated catalog
          content:
            application/json: {schema: {$ref: '#/components/schemas/Bootstrap'}}
  /api/profile:
    patch:
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProfilePatch'}
      responses:
        '200': {description: Saved profile}
  /api/garden/intro-seen:
    post:
      description: Atomically marks the authenticated account's garden intro seen. Repeated calls are safe; profile saves cannot reset this flag.
      responses:
        '200': {description: Saved, content: {application/json: {schema: {type: object, required: [seen], properties: {seen: {type: boolean, enum: [true]}}}}}}
        '401': {description: Invalid or absent MAX authentication}
  /api/onboarding/location-intro-seen:
    post:
      description: Atomically remembers that the voluntary location prompt was closed. Repeated calls are safe; this method does not request coordinates.
      responses:
        '200': {description: Saved, content: {application/json: {schema: {type: object, required: [seen], properties: {seen: {type: boolean, enum: [true]}}}}}}
        '401': {description: Invalid or absent MAX authentication}
        '503': {description: RecSys temporarily unavailable}
  /api/events/{eventId}:
    get:
      description: Opens an active age-eligible event from the daily MAX digest, including events outside the selected city.
      parameters:
        - {name: eventId, in: path, required: true, schema: {type: string, pattern: '^[a-zA-Z0-9_-]+$'}}
      responses:
        '200': {description: Public event card without private annotations}
        '404': {description: Event unavailable or age-ineligible}
  /api/location:
    get:
      description: Returns the saved voluntary point without consuming or extending it.
      responses:
        '200': {description: Current point and request status, content: {application/json: {schema: {$ref: '#/components/schemas/LocationResponse'}}}}
    post:
      description: Saves a browser-provided point for 24 hours.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LocationPoint'}
      responses:
        '200': {description: Saved point, content: {application/json: {schema: {$ref: '#/components/schemas/LocationResponse'}}}}
        '400': {description: Invalid coordinates}
    delete:
      description: Deletes the saved point before its expiry.
      responses:
        '200': {description: Point deleted}
  /api/location/request:
    post:
      description: Asks the MAX bot to request the user's location. The user must approve it in MAX.
      responses:
        '200': {description: Request sent or already pending}
        '403': {description: Not running inside MAX}
        '502': {description: MAX request failed}
  /api/plans:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventId]
              properties:
                eventId: {type: string}
                selectedVacancyId: {type: string, nullable: true}
                mode: {type: string, enum: [friend, solo]}
                when: {type: string, format: date-time, nullable: true}
                meeting: {type: string, maxLength: 240}
      responses:
        '201': {description: Created personal plan}
        '200': {description: Existing open personal plan, including concurrent retries}
        '400': {description: Validation error}
        '403': {description: Event is unavailable for the profile or age}
  /api/plans/{id}:
    patch:
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PlanPatch'}
      responses:
        '200': {description: Updated plan}
        '403': {description: Only owner can edit}
        '400': {description: Completion requires elapsed agreed date, confirmation and reflection}
        '409': {description: Concurrent request already closed this plan}
  /api/plans/{id}/invite:
    post:
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '201': {description: One-time invite code, valid seven days}
    delete:
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Invite revoked}
  /api/invites/{code}:
    get:
      security: []
      parameters: [{name: code, in: path, required: true, schema: {type: string, minLength: 36}}]
      responses:
        '200': {description: Minimal invitation preview}
        '410': {description: Expired or revoked invite}
    post:
      security: []
      parameters: [{name: code, in: path, required: true, schema: {type: string, minLength: 36}}]
      responses:
        '200': {description: Joined plan}
        '403': {description: Age or registration restriction}
  /api/recommendations/feedback:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventId, action, context]
              properties:
                eventId: {type: string}
                selectedVacancyId: {type: string, nullable: true}
                action: {type: string, enum: [like, skip]}
                context: {type: string, enum: [calibration, daily]}
      responses:
        '200': {description: Updated recommendation state}
        '400': {description: Invalid action}
  /api/recommendations/signals:
    post:
      description: Records one idempotent detail-opening signal; view time and scroll are not tracked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventId, action]
              properties:
                eventId: {type: string}
                selectedVacancyId: {type: string, nullable: true}
                action: {type: string, enum: [open_detail]}
      responses:
        '200': {description: Signal recorded}
        '404': {description: Event is no longer available}
  /api/me:
    delete:
      responses:
        '200': {description: User, plans and memberships deleted}
components:
  securitySchemes:
    maxInitData:
      type: apiKey
      in: header
      name: X-Max-Init-Data
      description: MAX WebApp.initData; server validates HMAC with MAX bot token. Demo mode uses HttpOnly first_session instead.
  schemas:
    ProfilePatch:
      type: object
      properties:
        city: {type: string, enum: [Москва, Санкт-Петербург, Казань, Рыбинск]}
        interests: {type: array, maxItems: 14, items: {type: string}}
        age: {type: integer, minimum: 7, maximum: 100, description: Optional age collected after calibration; does not reset recommendations.}
        volunteerExperience: {type: string, enum: [first_time, experienced], description: Asked after topic selection and before six calibration swipes. Existing profiles remain unset.}
        registration:
          type: object
          required: [name, age]
          properties:
            name: {type: string, minLength: 2, maxLength: 60}
            age: {type: integer, minimum: 7, maximum: 100}
        category: {type: string, enum: [all, animals, people]}
        barrier: {type: string, enum: [company, unknown, time]}
        reminders: {type: boolean}
        dailyDigest: {type: boolean, description: Receive a daily recommendation message in MAX}
    PlanPatch:
      type: object
      properties:
        when: {type: string, format: date-time, nullable: true}
        meeting: {type: string, maxLength: 240}
        confirmed: {type: boolean}
        checks: {type: array, items: {type: string, enum: [contact, route, bag]}}
        status: {type: string, enum: [done, cancelled]}
        reflection: {type: string, enum: [warm, okay, hard]}
        hours: {type: number, minimum: 0, maximum: 24, multipleOf: 0.5}
    LocationPoint:
      type: object
      required: [lat, lng]
      properties:
        lat: {type: number, minimum: -90, maximum: 90}
        lng: {type: number, minimum: -180, maximum: 180}
    LocationResponse:
      type: object
      required: [location, pending]
      properties:
        location:
          nullable: true
          allOf: [{$ref: '#/components/schemas/LocationPoint'}]
          description: Point and expiry; omitted from history and encrypted at rest.
        pending: {type: boolean}
    Bootstrap:
      type: object
      required: [user, plans, catalog, recommendations, location, mode]
      properties:
        user:
          type: object
          properties:
            gardenIntroSeen: {type: boolean}
            locationPromptSeen: {type: boolean}
            profile:
              type: object
              properties:
                age: {type: integer, nullable: true}
                volunteerExperience: {type: string, nullable: true, enum: [first_time, experienced]}
        plans: {type: array, items: {type: object}}
        catalog: {type: array, items: {type: object}}
        recommendations: {type: object}
        location: {nullable: true, type: object}
        mode: {type: string, enum: [demo, max]}

# PostgreSQL is not public. All TCP clients must use TLS and SCRAM.
local all postgres peer
local all all reject
hostnossl all all 0.0.0.0/0 reject
hostnossl all all ::/0 reject
hostssl dobrie_dela dobrie_dela_app 0.0.0.0/0 scram-sha-256
hostssl dobrie_dela dobrie_dela_app ::/0 scram-sha-256
hostssl all postgres 0.0.0.0/0 scram-sha-256
hostssl all postgres ::/0 scram-sha-256
host all all 0.0.0.0/0 reject
host all all ::/0 reject

services:
  max-bot:
    build: .
    ports:
      - "127.0.0.1:3210:3210"
    environment:
      DEMO_MODE: ${DEMO_MODE:-true}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
      MAX_BOT_USERNAME: ${MAX_BOT_USERNAME:-}
      MAX_MINI_APP_URL: ${MAX_MINI_APP_URL:-}
      MAX_WEBHOOK_URL: ${MAX_WEBHOOK_URL:-}
      MAX_WEBHOOK_SECRET: ${MAX_WEBHOOK_SECRET:-}
      MAX_POLLING: ${MAX_POLLING:-true}
      MAX_CA_BUNDLE: /app/russiantrustedca.pem
    volumes:
      - max-bot-data:/app/var
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3210/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  max-bot-data:
